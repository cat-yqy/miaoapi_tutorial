site_name: MiaoAPI 教程
site_description: MiaoAPI 使用教程与实践笔记
site_author: cat-yqy
site_url: https://cat-yqy.github.io/miaoapi_tutorial/

repo_name: cat-yqy/miaoapi_tutorial
repo_url: https://github.com/cat-yqy/miaoapi_tutorial
edit_uri: edit/main/docs/

copyright: "Copyright &copy; 2026 cat-yqy"

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 工具接入:
      - 安装 Codex CLI / App: guide/install.md
      - 在 Codex 中配置喵API: guide/configure.md
      - Claude Code: guide/claude-code.md
      - OpenCode: guide/opencode.md
      - Grok Build: guide/grok-build.md
      - 使用 GPT-Image-2 生成图片: guide/image-generation.md
      - 常见报错与解决方法: guide/troubleshooting.md
  - Claude Code 指南:
      - Claude Code 功能全景: claude-code/overview.md
      - Claude Code 核心机制: claude-code/core-concepts.md
      - Claude Code 日常使用: claude-code/daily-workflow.md
      - Claude Code 进阶能力: claude-code/advanced.md
      - Claude Code 场景实战: claude-code/playbooks.md
      - Claude Code 最佳实践: claude-code/best-practices.md
  - OpenCode 指南:
      - OpenCode 功能全景: opencode/overview.md
      - OpenCode 核心机制: opencode/core-concepts.md
      - OpenCode 日常使用: opencode/daily-workflow.md
      - OpenCode 进阶能力: opencode/advanced.md
      - OpenCode 场景实战: opencode/playbooks.md
      - OpenCode 最佳实践: opencode/best-practices.md
  - Codex 指南:
      - Codex 功能全景: codex/overview.md
      - Codex 核心机制: codex/core-concepts.md
      - Codex 日常使用: codex/daily-workflow.md
      - Codex 进阶能力: codex/advanced.md
      - Codex 场景实战: codex/playbooks.md
      - Codex 最佳实践: codex/best-practices.md
  - Clash Verge:
      - Clash Verge 介绍: clash-verge/overview.md
      - Clash Verge 安装: clash-verge/install.md
      - Clash Verge 快速上手: clash-verge/quickstart.md
      - Clash Verge 详细配置: clash-verge/configuration.md
      - Clash Verge 日常使用: clash-verge/usage.md
      - Clash Verge 排错: clash-verge/troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://miaoapi.site
      name: MiaoAPI 官网
    - icon: fontawesome/brands/github
      link: https://github.com/cat-yqy/miaoapi_tutorial
      name: GitHub 仓库

extra_css:
  - stylesheets/extra.css
