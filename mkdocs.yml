site_name: MiaoAPI 教程
site_description: MiaoAPI 使用教程与实践笔记
site_author: cat-yqy
site_url: https://cat-yqy.github.io/miaoapi_tutorial/

repo_name: cat-yqy/miaoapi_tutorial
repo_url: https://github.com/cat-yqy/miaoapi_tutorial
edit_uri: edit/main/docs/

copyright: "Copyright &copy; 2026 cat-yqy"

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 工具接入:
      - 安装 Codex CLI / App: guide/install.md
      - 在 Codex 中配置喵API: guide/configure.md
      - Claude Code: guide/claude-code.md
      - OpenCode: guide/opencode.md
      - Grok Build: guide/grok-build.md
      - 使用 GPT-Image-2 生成图片: guide/image-generation.md
      - 常见报错与解决方法: guide/troubleshooting.md
  - Codex 指南:
      - 功能全景: codex/overview.md
      - 核心机制: codex/core-concepts.md
      - 日常使用: codex/daily-workflow.md
      - 进阶能力: codex/advanced.md
      - 场景实战: codex/playbooks.md
      - 最佳实践: codex/best-practices.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://miaoapi.site
      name: MiaoAPI 官网
    - icon: fontawesome/brands/github
      link: https://github.com/cat-yqy/miaoapi_tutorial
      name: GitHub 仓库

extra_css:
  - stylesheets/extra.css
